<text x="1115" y="507" font-size="12" text-anchor="middle">optional:</text><text x="1115" y="525" font-size="12" text-anchor="middle">oscilloscope or</text><text x="1115" y="543" font-size="12" text-anchor="middle">INA226 logger</text><text x="1115" y="561" font-size="12" text-anchor="middle">(2nd MCU)</text>
<rect x="20" y="795" width="1160" height="95" rx="8" fill="#f4f4f4" stroke="#ccc"/>
<text x="35" y="820" font-size="13">1. Measurement: USB unplugged, switch closed, RIGOL output on. Flashing or USB readout: RIGOL output off, switch open, then plug in USB.</text>
<text x="35" y="846" font-size="13">2. Wires: 0.5 mm² (20–22 AWG), ≤ 30 cm, twisted, soldered or in screw terminals. No dupont jumpers in the power path.</text>
<text x="35" y="872" font-size="13">3. Do not use for add-ons: GPIO 6–11 (flash), 0/2/5/12/15 (boot straps), 1/3 (UART). Safe: 4, 13, 14, 16–19, 21 (SDA), 22 (SCL), 23, 25–27, 32, 33.</text>
