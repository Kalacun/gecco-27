# Konfiguracija strežnika succulent za rezultate ea_energija.ino.
# Vsak POST z ESP32 je ena vrstica (en zagon enega algoritma).
# Imena stolpcev se morajo ujemati s polji, ki jih pošilja v_json() v .ino.
data:
  - name: 'prevod'   # oznaka prevoda (datum in ura) = ID celotnega zagona programa
  - name: 'mac'   # MAC naslov ESP32
  - name: 'zagonov'
  - name: 'spanje'
  - name: 'opt'
  - name: 'ogrevanje'
  - name: 'tock'
  - name: 'cilj'
  - name: 'seme'
  - name: 'resetov'   # 1 = ESP32 se med poskusom ni resetiral
  - name: 'i'   # zaporedna številka zagona (vrstni red v toku)
  - name: 'poskus'   # indeks v tabeli POSKUSI
  - name: 'funkcija'
  - name: 'D'
  - name: 'alg'
  - name: 'zagon'   # številka bloka
  - name: 'poz'   # položaj v bloku
  - name: 'ogrev'   # 1 = ogrevalni zagon
  - name: 'fe'
  - name: 'gen'
  - name: 'best'
  - name: 'cas_ms'
  - name: 'fe_cilj'
  - name: 'ms_cilj'
  - name: 'np_konec'
  - name: 'LS_NP_INIT'
  - name: 'konv'   # TOCK vrednosti, ločenih s podpičjem
timestamp: true        # čas prejema na strežniku
password: 'spremeni-me'   # enako kot SUCC_GESLO v wifi_nastavitve.h
results:
  - enable: true       # GET /data  (JSON)
  - export: true       # GET /export (CSV) - uporablja "zajem.py succulent"
explore:
  - enable: true       # spletni pregled na http://<IP>:8080/explore
  - refresh: 10
